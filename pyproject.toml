[project]
name = "shandorcode"
version = "0.2.0"
description = "AI code analysis and optimization toolkit (community edition)"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Chris Arseno", email = "chris@gozerai.com"}
]

dependencies = [
    # ── Core framework ─────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "PyYAML>=6.0.1",
    "pypdf>=4.3.0",

    # ── Visualization subsystem (existing) ─────────────────────────
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "watchdog>=3.0.0",
    "networkx>=3.2",
    "radon>=6.0.1",
    "pygments>=2.17.0",

    # ── Intelligence layer: model providers ────────────────────────
    "openai>=1.50.0",
    "anthropic>=0.40.0",

    # ── Intelligence layer: storage ────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.0.0",

    # ── Observability (OpenTelemetry GenAI semconv) ────────────────
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Coverage threshold relaxed during the multi-repo refactor (Phase 1 of Shandor suite plan)
# and the AI intelligence layer scaffold (Phase 1 of the implementation plan).
# Restore --cov-fail-under=80 once SessionManager + workspace bootstrap (Phase 1.6) ships
# AND the intelligence-layer Foundation milestone exits.
addopts = "--cov=src --cov-report=term-missing"
